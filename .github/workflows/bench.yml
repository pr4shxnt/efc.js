# Nightly data-layer benchmarks (bench/): EFC vs Prisma and Drizzle (PostgreSQL) and mongoose
# (MongoDB). Fails when EFC falls further behind the fastest contender than in
# bench/results/baseline.json (ratio-based, so runner speed doesn't matter). Also on demand.
name: Benchmarks

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: efc_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BENCH_PG_URL: postgres://postgres@127.0.0.1:5432/efc_bench
      BENCH_MONGO_URL: mongodb://127.0.0.1:27017/efc_bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build the framework
        run: |
          npm ci --workspaces --include-workspace-root
          npm run build --workspaces --if-present
      - name: Install the benchmark suite
        working-directory: bench
        run: |
          npm ci
          npx prisma generate
          npx prisma db push
      - name: Run and compare with the baseline
        working-directory: bench
        run: npx tsx run.ts --json results/latest.json --compare results/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results/latest.json
